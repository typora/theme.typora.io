name: Decode MiniChicken thumbnail

on:
  push:
    paths:
      - "media/thumbnails/minichicken.png.b64"
      - ".github/workflows/decode-minichicken-thumb.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode thumbnail
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          src = Path("media/thumbnails/minichicken.png.b64")
          dest = Path("media/thumbnails/minichicken.png")
          dest.write_bytes(base64.b64decode(src.read_text()))
          print(f"wrote {dest} ({dest.stat().st_size} bytes)")
          PY
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/thumbnails/minichicken.png
          if git diff --cached --quiet; then
            echo "No PNG changes"
          else
            git commit -m "Add MiniChicken gallery thumbnail"
            git push
          fi
